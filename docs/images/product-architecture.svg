<svg xmlns="http://www.w3.org/2000/svg" width="960" height="864" viewBox="0 0 960 864" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="864" fill="#ffffff"/>

  <!-- AI workloads layer -->
  <rect x="24" y="20" width="912" height="100" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="162" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">AI Workloads</text>
  <rect x="300" y="34" width="290" height="72" rx="10" fill="#ffffff" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="445" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">Training</text>
  <rect x="620" y="34" width="290" height="72" rx="10" fill="#ffffff" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="765" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">Inference</text>

  <!-- Consumers layer -->
  <rect x="24" y="144" width="912" height="124" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

