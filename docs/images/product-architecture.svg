  <text x="480" y="455" text-anchor="middle" font-size="11.5" fill="#334155">RDMA Metrics</text>
  <text x="480" y="467" text-anchor="middle" font-size="8.5" fill="#64748B">Host · Pod</text>
  <rect x="354" y="481" width="252" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="480" y="502" text-anchor="middle" font-size="11.5" fill="#334155">Switch Metrics</text>
  <rect x="354" y="522" width="252" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="480" y="543" text-anchor="middle" font-size="11.5" fill="#334155">NVLink Metrics</text>
  <rect x="354" y="563" width="252" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="480" y="584" text-anchor="middle" font-size="11.5" fill="#334155">eBPF-based RDMA Tracing</text>
  <rect x="354" y="604" width="252" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="480" y="619" text-anchor="middle" font-size="11.5" fill="#334155">End-to-End Traffic Path Tracing</text>
  <text x="480" y="631" text-anchor="middle" font-size="8.5" fill="#64748B">per workload · Pod → Host → Switch</text>

  <!-- Capability: Network Health Checks -->
  <rect x="640" y="380" width="280" height="268" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="780" y="416" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">Network Health Checks</text>
  <rect x="654" y="480" width="252" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="780" y="505" text-anchor="middle" font-size="11.5" fill="#334155">Passive Health Status</text>
  <rect x="654" y="548" width="252" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="780" y="573" text-anchor="middle" font-size="11.5" fill="#334155">Active Path Probing</text>

  <!-- Infrastructure layer -->
  <rect x="24" y="688" width="912" height="156" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="48" y="718" font-size="16" font-weight="bold" fill="#475569">Infrastructure</text>

  <rect x="48" y="734" width="284" height="92" rx="8" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="190" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Scale-out Network</text>
  <text x="190" y="794" text-anchor="middle" font-size="12" fill="#64748B">SONiC RoCE · Spectrum-X · InfiniBand</text>

  <rect x="352" y="734" width="284" height="92" rx="8" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="494" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Scale-up Network</text>
  <text x="494" y="794" text-anchor="middle" font-size="12" fill="#64748B">NVLink · NVSwitch</text>

  <rect x="656" y="734" width="256" height="92" rx="8" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="784" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Storage Network</text>
  <text x="784" y="794" text-anchor="middle" font-size="12" fill="#64748B">RoCE · InfiniBand</text>
</svg>
