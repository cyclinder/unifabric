  <rect x="48" y="158" width="424" height="96" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="260" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Schedulers</text>
  <rect x="62" y="194" width="124" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="124" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">Kueue</text>
  <rect x="198" y="194" width="124" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="260" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">Volcano</text>
  <rect x="334" y="194" width="124" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="396" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">KAI Scheduler</text>

  <rect x="496" y="158" width="200" height="96" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="596" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Grafana</text>

  <rect x="712" y="158" width="200" height="96" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="812" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Prometheus</text>

  <!-- Unifabric container -->
  <rect x="24" y="292" width="912" height="372" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="480" y="330" text-anchor="middle" font-size="25" font-weight="bold" fill="#1E3A8A">Unifabric</text>
  <text x="480" y="356" text-anchor="middle" font-size="12.5" fill="#475569">Observability for the high-speed networks of cloud-native AI clusters</text>

  <!-- Capability: Topology Discovery -->
  <rect x="40" y="380" width="280" height="268" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="180" y="408" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">Topology Discovery</text>
  <text x="180" y="427" text-anchor="middle" font-size="10.5" fill="#64748B">NVIDIA Topograph, etc.</text>
  <rect x="54" y="456" width="252" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="180" y="481" text-anchor="middle" font-size="11.5" fill="#334155">Node Topology Labels</text>
  <rect x="54" y="516" width="252" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="180" y="541" text-anchor="middle" font-size="11.5" fill="#334155">Topology Visualization</text>
  <rect x="54" y="576" width="252" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="180" y="601" text-anchor="middle" font-size="11.5" fill="#334155">Multi Plane</text>

