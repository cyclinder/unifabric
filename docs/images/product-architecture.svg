<svg xmlns="http://www.w3.org/2000/svg" width="960" height="864" viewBox="0 0 960 864" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="864" fill="#ffffff"/>

  <!-- AI workloads layer -->
  <rect x="24" y="20" width="912" height="100" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="48" y="76" font-size="16" font-weight="bold" fill="#1E40AF">AI Workloads</text>
  <rect x="300" y="34" width="290" height="72" rx="10" fill="#ffffff" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="445" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">Training</text>
  <rect x="620" y="34" width="290" height="72" rx="10" fill="#ffffff" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="765" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">Inference</text>

  <!-- Consumers layer -->
  <rect x="24" y="144" width="912" height="124" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="48" y="166" width="272" height="80" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="184" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Schedulers</text>
  <text x="184" y="224" text-anchor="middle" font-size="12" fill="#64748B">Kueue · Volcano · KAI Scheduler</text>

  <rect x="344" y="166" width="272" height="80" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="480" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Grafana</text>

  <rect x="640" y="166" width="272" height="80" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="776" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Prometheus</text>

  <!-- Unifabric container -->
  <rect x="24" y="292" width="640" height="372" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="344" y="330" text-anchor="middle" font-size="25" font-weight="bold" fill="#1E3A8A">Unifabric</text>
  <text x="344" y="356" text-anchor="middle" font-size="12.5" fill="#475569">Observability for the high-speed networks of cloud-native AI clusters</text>

  <!-- Capability: Topology Discovery -->
  <rect x="40" y="380" width="192" height="268" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="136" y="406" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">Topology</text>
  <text x="136" y="426" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">Discovery</text>
  <rect x="54" y="452" width="164" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="136" y="477" text-anchor="middle" font-size="11.5" fill="#334155">Topology Visualization</text>
  <rect x="54" y="512" width="164" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="136" y="537" text-anchor="middle" font-size="11.5" fill="#334155">Node Topology Labels</text>
  <rect x="54" y="572" width="164" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="136" y="597" text-anchor="middle" font-size="11.5" fill="#334155">Multi Plane</text>

  <!-- Capability: High-Speed Network Traffic Observability -->
  <rect x="248" y="380" width="192" height="268" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="344" y="402" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">High-Speed Network</text>
  <text x="344" y="422" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">Traffic Observability</text>
  <rect x="262" y="436" width="164" height="202" rx="8" fill="none" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="272" y="446" width="144" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="344" y="466" text-anchor="middle" font-size="11" fill="#334155">RDMA NIC Traffic</text>
  <rect x="272" y="484" width="144" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="344" y="504" text-anchor="middle" font-size="11" fill="#334155">Switch RDMA Traffic</text>
  <rect x="272" y="522" width="144" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="344" y="538" text-anchor="middle" font-size="11" fill="#334155">RDMA Flow Tracing</text>
  <text x="344" y="548" text-anchor="middle" font-size="8.5" fill="#64748B">eBPF-based</text>
  <rect x="272" y="560" width="144" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="344" y="580" text-anchor="middle" font-size="11" fill="#334155">NVLink Traffic</text>
  <rect x="272" y="598" width="144" height="30" rx="6" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="344" y="617" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1E3A8A">Pod / Workload Attribution</text>

  <!-- Capability: RDMA Network Health Checks -->
  <rect x="456" y="380" width="192" height="268" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="552" y="406" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">RDMA Network</text>
  <text x="552" y="426" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">Health Checks</text>
  <rect x="470" y="472" width="164" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="552" y="497" text-anchor="middle" font-size="11.5" fill="#334155">Passive Health Status</text>
  <rect x="470" y="544" width="164" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="552" y="569" text-anchor="middle" font-size="11.5" fill="#334155">Active Path Probing</text>

  <!-- External topology sources -->
  <rect x="688" y="292" width="248" height="372" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="812" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">External topology</text>
  <text x="812" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">sources</text>

  <rect x="712" y="432" width="200" height="90" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="812" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">NVIDIA</text>
  <text x="812" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Topograph</text>

  <!-- Infrastructure layer -->
  <rect x="24" y="688" width="912" height="156" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="48" y="718" font-size="16" font-weight="bold" fill="#475569">Infrastructure</text>

  <rect x="48" y="734" width="284" height="92" rx="8" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="190" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Scale-out Network</text>
  <text x="190" y="794" text-anchor="middle" font-size="12" fill="#64748B">SONiC RoCE · Spectrum-X · InfiniBand</text>

  <rect x="352" y="734" width="284" height="92" rx="8" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="494" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Scale-up Network</text>
  <text x="494" y="794" text-anchor="middle" font-size="12" fill="#64748B">NVLink · NVSwitch</text>

  <rect x="656" y="734" width="256" height="92" rx="8" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="784" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Storage Network</text>
  <text x="784" y="794" text-anchor="middle" font-size="12" fill="#64748B">RoCE · InfiniBand</text>
</svg>
