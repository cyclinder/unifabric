  <rect x="340" y="380" width="280" height="268" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="480" y="406" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E3A8A">High-Speed Network</text>
